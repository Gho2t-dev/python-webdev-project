<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quote Library · Edit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <a class="logo-link" href="landingpage.html">
      <img class="logo" src="resources/quote_library_logo_bw.svg" alt="Quote Library logo">
    </a>
    <h1>Quote Library</h1>

    <nav>
      <a href="landingpage.html">Home</a>
      <a href="showAllQuotes.html">All quotes</a>
      <a href="showSpecificQuote.html">Find a quote</a>
      <a href="createNewQuote.html">Create</a>
      <a href="changeQuote.html" class="active">Edit</a>
      <a href="deleteQuote.html">Delete</a>
    </nav>
  </header>

  <main>
    <div class="card">
      <h2>Edit a quote</h2>
      <p class="hint">
        First we load the quote with <code>GET /quotes/&lbrace;id&rbrace;</code> so you can see
        what you're changing, then save with <code>PUT /quotes/&lbrace;id&rbrace;</code>.
      </p>

      <form id="loadQuoteForm">
        <label for="editQuoteId">Quote ID</label>
        <input type="number" id="editQuoteId" min="1" required>
        <button type="submit">Load quote</button>
      </form>
    </div>

    <div class="card hidden" id="editFields">
      <h2>Update details</h2>
      <form id="editQuoteForm">
        <label for="editQuoteText">Quote</label>
        <textarea id="editQuoteText" rows="3" required></textarea>

        <label for="editQuoteAuthor">Author</label>
        <input type="text" id="editQuoteAuthor">

        <label for="editQuoteYear">Year</label>
        <input type="number" id="editQuoteYear">

        <button type="submit">Save changes</button>
      </form>
    </div>

    <p id="editStatus" class="status-message hidden"></p>
  </main>

  <footer>
    <p>&copy; 2026 Fabian H.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
